# Per-language vulnerability scanners, all free and tokenless.
# Runs on every PR + weekly to catch newly-disclosed CVEs.
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Audit production + dev dependencies
        run: npm audit --audit-level=high

  python-audit:
    name: pip-audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pip-audit + project
        working-directory: python
        run: |
          pip install --require-hashes -r ../.github/requirements/pip-audit.txt
          pip install --no-deps -e .
      - name: Run pip-audit against installed environment
        # CVE-2026-3219 is in pip itself (the runner's installer), not in
        # our Python package. No patched pip release available yet —
        # suppress until upstream ships a fix. Re-evaluate by removing
        # this flag periodically; if pip-audit no longer reports it,
        # take the flag back out.
        run: pip-audit --skip-editable --progress-spinner=off --ignore-vuln CVE-2026-3219

  ruby-audit:
    name: bundler-audit (Ruby)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          working-directory: ruby
          bundler-cache: true
      - name: Install bundler-audit
        run: gem install bundler-audit
      - name: "Ensure Gemfile.lock exists (library policy: not committed)"
        working-directory: ruby
        run: bundle install
      - name: Run bundler-audit
        working-directory: ruby
        run: bundle-audit update && bundle-audit check

  go-audit:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
          cache-dependency-path: go/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 # v1.9.0
      - name: Run govulncheck
        working-directory: go
        run: govulncheck ./...

  rust-audit:
    name: cargo-audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: "Generate lockfile (library policy: not committed)"
        working-directory: rust
        run: cargo generate-lockfile
      - name: Run cargo-audit
        working-directory: rust
        run: cargo audit

  dep-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
