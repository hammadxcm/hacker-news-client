# Per-language coverage upload to Codecov. Free for public repos; tokenless.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    name: JS coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run c8
        run: npx c8 --reporter=lcov --reports-dir=coverage/js --include='js/src/**' node --test js/test/*.test.js
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage/js/lcov.info
          flags: js
          fail_ci_if_error: false

  ts:
    name: TS coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run c8
        run: npx c8 --reporter=lcov --reports-dir=coverage/ts --include='ts/src/**' --exclude='ts/src/**/*.d.ts' node --test --experimental-strip-types --disable-warning=ExperimentalWarning ts/test/*.test.ts
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage/ts/lcov.info
          flags: typescript
          fail_ci_if_error: false

  python:
    name: Python coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install coverage
        run: pip install --require-hashes -r .github/requirements/coverage.txt
      - name: Run coverage
        working-directory: python
        run: |
          python -m coverage run --source=src/hacker_news_client -m unittest tests.test_client tests.test_unit
          python -m coverage xml -o coverage.xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false

  go:
    name: Go coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
          cache-dependency-path: go/go.sum
      - name: Run coverage
        working-directory: go
        run: go test -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: go/coverage.out
          flags: go
          fail_ci_if_error: false

  ruby:
    name: Ruby coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          working-directory: ruby
          bundler-cache: true
      - name: Install simplecov-lcov for Codecov
        working-directory: ruby
        run: gem install simplecov simplecov-lcov
      - name: Run tests with coverage
        working-directory: ruby
        env:
          COVERAGE: "1"
        run: bundle exec rake test
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ruby/coverage/coverage.xml,ruby/coverage/.resultset.json
          flags: ruby
          fail_ci_if_error: false

  rust:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov
      - name: Generate lcov
        working-directory: rust
        run: cargo llvm-cov --tests --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: rust/lcov.info
          flags: rust
          fail_ci_if_error: false
